name: Build Nexora Host IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Cache CPython iOS framework
        uses: actions/cache@v4
        with:
          path: Vendor/Python.xcframework
          key: cpython-ios-3.14.7-xcode26.6-v2

      - name: Verify Xcode / iOS 26 SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version | grep -E '^26\.'

      - name: Resolve packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project PocketHost.xcodeproj \
            -scheme PocketHost

      - name: Build unsigned IPA
        run: |
          chmod +x Scripts/build-unsigned-ipa.sh
          ./Scripts/build-unsigned-ipa.sh
          mv build/ipa/PocketHost-unsigned.ipa build/ipa/Nexora-Host-unsigned.ipa
          shasum -a 256 build/ipa/Nexora-Host-unsigned.ipa > build/ipa/Nexora-Host-unsigned.ipa.sha256
          rm -f build/ipa/PocketHost-unsigned.ipa.sha256

      - name: Verify embedded runtimes
        run: |
          VERIFY_DIR="$(mktemp -d)"
          unzip -q build/ipa/Nexora-Host-unsigned.ipa -d "$VERIFY_DIR"
          APP="$VERIFY_DIR/Payload/PocketHost.app"
          test -x "$APP/Frameworks/NodeMobile.framework/NodeMobile"
          test -x "$APP/Frameworks/Python.framework/Python"
          test -d "$APP/python/lib/python3.14"
          xcrun nm -gU "$APP/Frameworks/NodeMobile.framework/NodeMobile" | grep -E '(_node_start| node_start)$'
          find "$APP/python/lib/python3.14/lib-dynload" -name '*.fwork' -print -quit | grep -q .
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP/Info.plist" | grep -Fx 'Nexora Host'
          /usr/libexec/PlistBuddy -c 'Print :BGTaskSchedulerPermittedIdentifiers:1' "$APP/Info.plist" | grep -Fx 'app.nexorahost.continuedHosting'
          rm -rf "$VERIFY_DIR"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Nexora-Host-unsigned
          path: |
            build/ipa/Nexora-Host-unsigned.ipa
            build/ipa/Nexora-Host-unsigned.ipa.sha256
          if-no-files-found: error
