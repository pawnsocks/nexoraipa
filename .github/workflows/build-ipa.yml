name: Build Nexora Host IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Resolve packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project PocketHost.xcodeproj \
            -scheme PocketHost

      - name: Build unsigned IPA
        run: |
          chmod +x Scripts/build-unsigned-ipa.sh
          ./Scripts/build-unsigned-ipa.sh

          mv \
            build/ipa/PocketHost-unsigned.ipa \
            build/ipa/Nexora-Host-unsigned.ipa

          shasum -a 256 \
            build/ipa/Nexora-Host-unsigned.ipa \
            > build/ipa/Nexora-Host-unsigned.ipa.sha256

          rm -f build/ipa/PocketHost-unsigned.ipa.sha256

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Nexora-Host-unsigned
          path: |
            build/ipa/Nexora-Host-unsigned.ipa
            build/ipa/Nexora-Host-unsigned.ipa.sha256
          if-no-files-found: error
