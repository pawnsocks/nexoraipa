name: Build PocketHost IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Resolve packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project PocketHost.xcodeproj \
            -scheme PocketHost

      - name: Build IPA
        run: |
          chmod +x Scripts/build-unsigned-ipa.sh
          ./Scripts/build-unsigned-ipa.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PocketHost-iPhone13-unsigned
          path: build/ipa/PocketHost-unsigned.ipa
