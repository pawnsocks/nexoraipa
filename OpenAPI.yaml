openapi: 3.1.0
info:
  title: Nexora Host Local API
  version: 1.1.0
  description: |
    Local development/control API exposed directly by Nexora Host on the Apple-device LAN interface.
    Protected endpoints require the on-device Bearer token. Live project logs use a
    separate WebSocket on port 8081; the first WebSocket frame must contain
    {"token":"...","projectID":"..."}.
servers:
  - url: http://{device}:8080/api/v1
    variables:
      device:
        default: nexora.local
security:
  - bearerAuth: []
paths:
  /health:
    get:
      security: []
      summary: Public health check
      responses:
        '200': {description: API is alive}
  /status:
    get:
      summary: Full Nexora Host status
      responses:
        '200': {description: Metrics, Auto-Tune state, runtimes, projects, packs and AI state}
  /metrics:
    get:
      summary: Current device/runtime metrics
      responses:
        '200': {description: Metrics snapshot}
  /runtimes:
    get:
      summary: List runtime adapters and availability
      responses:
        '200': {description: JavaScript, Python and Lua runtime state}
  /runtimes/{runtime}/execute:
    post:
      summary: Execute source code directly
      parameters:
        - $ref: '#/components/parameters/runtime'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeExecuteRequest'
      responses:
        '200': {description: Execution succeeded}
        '422': {description: Runtime unavailable or execution failed}

  /projects:
    get:
      summary: List projects
      responses:
        '200': {description: Projects}
    post:
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201': {description: Project created}
  /projects/{projectID}:
    parameters:
      - $ref: '#/components/parameters/projectID'
    get:
      summary: Get a project
      responses:
        '200': {description: Project}
        '404': {description: Project not found}
    delete:
      summary: Delete a project and its local files
      responses:
        '204': {description: Deleted}
  /projects/{projectID}/deployments:
    parameters:
      - $ref: '#/components/parameters/projectID'
    get:
      summary: List deployment releases
      responses:
        '200': {description: Deployments}
    post:
      summary: Create and activate a versioned deployment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeploymentRequest'
      responses:
        '201': {description: Deployment created}
  /projects/{projectID}/start:
    parameters:
      - $ref: '#/components/parameters/projectID'
    post:
      summary: Load the active project's entrypoint into its runtime context
      responses:
        '200': {description: Project started}
        '422': {description: Start failed}
  /projects/{projectID}/stop:
    parameters:
      - $ref: '#/components/parameters/projectID'
    post:
      summary: Destroy the project's logical runtime context
      responses:
        '200': {description: Project stopped}
  /projects/{projectID}/restart:
    parameters:
      - $ref: '#/components/parameters/projectID'
    post:
      summary: Stop then reload the active deployment
      responses:
        '200': {description: Project restarted}
        '422': {description: Restart failed}
  /projects/{projectID}/files:
    parameters:
      - $ref: '#/components/parameters/projectID'
      - in: query
        name: path
        schema: {type: string, default: ''}
    get:
      summary: List files under a relative workspace path
      responses:
        '200': {description: File list}
  /projects/{projectID}/file:
    parameters:
      - $ref: '#/components/parameters/projectID'
      - in: query
        name: path
        required: true
        schema: {type: string}
    get:
      summary: Read a workspace file
      responses:
        '200': {description: File content}
    put:
      summary: Create or replace a workspace file
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileWriteRequest'
      responses:
        '200': {description: File written}
    post:
      summary: Create or replace a workspace file
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileWriteRequest'
      responses:
        '200': {description: File written}
    delete:
      summary: Delete a workspace file
      responses:
        '204': {description: Deleted}
  /projects/{projectID}/logs:
    parameters:
      - $ref: '#/components/parameters/projectID'
      - in: query
        name: limit
        schema: {type: integer, minimum: 1, maximum: 500, default: 200}
    get:
      summary: Read recent project logs
      responses:
        '200': {description: Log entries}
  /projects/{projectID}/db/query:
    parameters:
      - $ref: '#/components/parameters/projectID'
    post:
      summary: Execute SQL against the project's SQLite database
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sql]
              properties:
                sql: {type: string}
      responses:
        '200': {description: SQL result}
        '422': {description: SQL failed}

  /runtime-packs:
    get:
      summary: List installed signed runtime/data packs
      responses:
        '200': {description: Runtime packs}
  /runtime-packs/install:
    post:
      summary: Verify and install a signed data/WASM runtime pack
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimePackInstallRequest'
      responses:
        '201': {description: Pack installed}
        '422': {description: Integrity/signature/install failure}

  /ai/config:
    get:
      summary: Read NanoGPT configuration without exposing the secret key
      responses:
        '200': {description: AI configuration}
    put:
      summary: Store/change NanoGPT API key, base URL or selected model
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIConfigUpdateRequest'
      responses:
        '200': {description: Updated configuration}
    post:
      summary: Store/change NanoGPT API key, base URL or selected model
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIConfigUpdateRequest'
      responses:
        '200': {description: Updated configuration}
  /ai/models:
    get:
      summary: Fetch the current model list from NanoGPT
      responses:
        '200': {description: Models}
        '502': {description: Upstream NanoGPT request failed}
  /ai/chat:
    post:
      summary: Send an OpenAI-compatible chat request through NanoGPT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIChatRequest'
      responses:
        '200': {description: Assistant message}
        '502': {description: Upstream NanoGPT request failed}

  /kv:
    get:
      summary: List global KV keys
      responses:
        '200': {description: Key list}
  /kv/{key}:
    parameters:
      - $ref: '#/components/parameters/key'
    get:
      summary: Read a KV value
      responses:
        '200': {description: Value}
        '404': {description: Key not found}
    put:
      summary: Create or replace a KV value
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KVWriteRequest'
      responses:
        '201': {description: Stored}
    post:
      summary: Create or replace a KV value
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KVWriteRequest'
      responses:
        '201': {description: Stored}
    delete:
      summary: Delete a KV value
      responses:
        '204': {description: Deleted}
  /autotune:
    get:
      summary: Read Auto-Tune profile and effective policy
      responses:
        '200': {description: Auto-Tune state}
  /autotune/profile:
    put:
      summary: Change Auto-Tune profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profile]
              properties:
                profile:
                  type: string
                  enum: [Eco, Balanced, Aggressive, Turbo]
      responses:
        '200': {description: Applied profile}
    post:
      summary: Change Auto-Tune profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profile]
              properties:
                profile:
                  type: string
                  enum: [Eco, Balanced, Aggressive, Turbo]
      responses:
        '200': {description: Applied profile}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    key:
      in: path
      name: key
      required: true
      schema: {type: string}
    runtime:
      in: path
      name: runtime
      required: true
      schema:
        type: string
        enum: [javascript, python, lua]
    projectID:
      in: path
      name: projectID
      required: true
      schema: {type: string}
  schemas:
    RuntimeExecuteRequest:
      type: object
      required: [code]
      properties:
        code: {type: string, maxLength: 256000}
    CreateProjectRequest:
      type: object
      required: [name, runtime]
      properties:
        name: {type: string}
        runtime: {type: string, enum: [javascript, python, lua]}
        entrypoint: {type: string}
    DeploymentFile:
      type: object
      required: [path, content]
      properties:
        path: {type: string}
        content: {type: string}
        encoding: {type: string, enum: [utf8, base64]}
    CreateDeploymentRequest:
      type: object
      required: [files]
      properties:
        files:
          type: array
          items: {$ref: '#/components/schemas/DeploymentFile'}
        runtime: {type: string, enum: [javascript, python, lua]}
        entrypoint: {type: string}
    FileWriteRequest:
      type: object
      required: [content]
      properties:
        content: {type: string}
        encoding: {type: string, enum: [utf8, base64]}
    RuntimePackManifest:
      type: object
      required: [id, version, runtime, sha256, signature, kind]
      properties:
        id: {type: string}
        version: {type: string}
        runtime: {type: string}
        sha256: {type: string}
        signature: {type: string, description: Base64 Ed25519 signature over raw payload}
        kind: {type: string, enum: [data, wasm]}
    RuntimePackInstallRequest:
      type: object
      required: [manifest, payloadBase64]
      properties:
        manifest: {$ref: '#/components/schemas/RuntimePackManifest'}
        payloadBase64: {type: string}
    AIConfigUpdateRequest:
      type: object
      properties:
        apiKey: {type: string, description: Stored in Keychain; empty string deletes it}
        selectedModel: {type: string}
        baseURL: {type: string, format: uri, default: 'https://nano-gpt.com/api/v1'}
    AIChatMessage:
      type: object
      required: [role, content]
      properties:
        role: {type: string, enum: [system, user, assistant]}
        content: {type: string}
    AIChatRequest:
      type: object
      required: [messages]
      properties:
        model: {type: string, description: Optional override; otherwise selected model is used}
        messages:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/AIChatMessage'}
        temperature: {type: number, minimum: 0, maximum: 2}
    KVWriteRequest:
      type: object
      required: [value]
      properties:
        value: {type: string}
        encoding: {type: string, enum: [utf8, base64], default: utf8}
